="108" y="176" font-size="20" font-weight="700" fill="#0A0C1C">Multi-Agent Trading Desk</text><rect x="398.0" y="158" width="96.0" height="22" rx="11" fill="#B45309" fill-opacity="0.14" stroke="#B45309" stroke-opacity="0.45" stroke-width="1"/><circle cx="410.0" cy="169" r="3" fill="#B45309"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle><text class="m" x="418.0" y="173" font-size="10" letter-spacing="1.2" fill="#B45309">IN PROGRESS</text><text class="m" x="72" y="216" font-size="12" fill="#4B5480">A deterministic scanner screens the S&amp;P 500, three specialist agents</text><text class="m" x="72" y="237" font-size="12" fill="#4B5480">review what it finds, and a pure-code risk gate gets the last word —</text><text class="m" x="72" y="258" font-size="12" fill="#4B5480">including the option to say no.</text><rect x="72.0" y="312" width="76.7" height="22" rx="11" fill="none" stroke="#DBDEF4" stroke-width="1"/><text class="m" x="82.0" y="327" font-size="10.5" fill="#7B85B0">LangGraph</text><rect x="155.7" y="312" width="127.1" height="22" rx="11" fill="none" stroke="#DBDEF4" stroke-width="1"/><text class="m" x="165.7" y="327" font-size="10.5" fill="#7B85B0">human-in-the-loop</text><rect x="289.8" y="312" width="76.7" height="22" rx="11" fill="none" stroke="#DBDEF4" stroke-width="1"/><text class="m" x="299.8" y="327" font-size="10.5" fill="#7B85B0">risk gate</text><rect x="373.5" y="312" width="101.9" height="22" rx="11" fill="none" stroke="#DBDEF4" stroke-width="1"/><text class="m" x="383.5" y="327" font-size="10.5" fill="#7B85B0">trade journal</text><rect x="612" y="158" width="516" height="168" rx="10" fill="#FDFDFF" fill-opacity="0.6" stroke="#DBDEF4" stroke-width="1" opacity="0.8"/><g transform="translate(649.0,306)"><g transform="scale(1,1)"><animateTransform attributeName="transform" type="scale" values="1 0;1 0;1 1" keyTimes="0;0.6429;1" dur="1.40s" begin="0s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2